$font = Iosevka Nerd Mono

general {
    hide_cursor = false
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/barti/cfg/modules/wallpapers/wallpaper6.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 1)
    outer_color = rgba(53, 105, 190, 0.93)
    check_color = rgba(25, 255, 25, 0.93)
    fail_color = rgba(255, 102, 51, 0.93)
    font_color = rgb(233, 233, 233)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL
    dots_size = 0.175
    dots_spacing = 0.3
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 40
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}
